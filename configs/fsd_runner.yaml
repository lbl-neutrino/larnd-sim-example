larnd-sim:
  config: "fsd"
  input_file: "/global/cfs/projectdirs/dune/www/data/FSD/simulation/FSD_CosmicRun3/run-convert2h5/FSD_CosmicRun3.convert2h5/EDEPSIM_H5/0000000/FSD_CosmicRun3.convert2h5.0000000.EDEPSIM.hdf5"
