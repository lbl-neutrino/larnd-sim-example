  output_dir: "profiles/nsys"
  output_file: "fsd_larnd_sim.profile"

ncu:
  exec: "/global/cfs/projectdirs/dune/users/cuddandr/packages/nsight-compute-2026.2/ncu"
  kernels: ["get_adc_values"]
  invocation: 30
  output_dir: "profiles/ncu"
  output_file: "fsd_larnd_sim.profile"

compare:
  reference: "larnd-sim-reference.hdf5"

report:
  report: "nvtx_sum"
  timeunit: "ms"
  format: "csv"
